name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ] # Se activa solo cuando hacés un push a tu rama principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Versión estándar y ultra estable para compilación de Android

    - name: Instalar dependencias del sistema Linux y Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev liblzma-dev lzma
        pip install --user --upgrade buildozer

    - name: Compilar APK con Buildozer
      run: |
        # Usamos yes para aceptar automáticamente todas las licencias del SDK de Android
        yes | buildozer android debug

    - name: Guardar y subir el APK como resultado
      uses: actions/upload-artifact@v4
      with:
        name: Aplicacion-Pinguino-Android
        path: bin/*.apk